{% extends "base.html" %}
{% block title %}Receta · SmartGastro{% endblock %}
{% block content %}
<div class="page-heading">
  <div><p class="eyebrow">Receta</p><h1>{{ item.icon }} {{ item.name }}</h1></div>
  <a class="button-link secondary" href="{{ url_for('menu') }}">Volver al menú</a>
</div>
<section class="panel">
  <p>Indicá el consumo exacto de cada ingrediente para una porción.</p>
  <form method="post" class="stack">
    <div class="recipe-grid">
    {% for ingredient in ingredients %}
      <label>
        <span>{{ ingredient.icon }} {{ ingredient.name }} ({{ ingredient.unit }})</span>
        <input name="ingredient_{{ ingredient.id }}" type="number" min="0" step="0.01" value="{{ quantities.get(ingredient.id, '') }}" placeholder="0">
      </label>
    {% endfor %}
    </div>
    <button type="submit">Guardar receta completa</button>
  </form>
</section>
{% endblock %}
