version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smartgastro_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartgastro
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smartgastro_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      SECRET_KEY: dev-secret-change-in-prod
      JWT_SECRET_KEY: dev-jwt-change-in-prod
      JWT_EXPIRES: 900
      JWT_REFRESH_EXPIRES: 2592000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: smartgastro
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
